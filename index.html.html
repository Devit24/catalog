<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Combiner Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2canvas for card-to-image exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ZXing Barcode Scanning Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .font-serif-elegant {
      font-family: 'Playfair Display', serif;
    }
    .font-mono-code {
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- React Root Anchor -->
  <div id="app-root"></div>

  <!-- React Code Base -->
  <script type="text/babel">
    const SvgIcons = {
      Search: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      ),
      Barcode: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/></svg>
      ),
      Image: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      ),
      Eye: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      ),
      EyeOff: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      ),
      Download: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      ),
      ChevronDown: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      ),
      Alert: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      ),
      Palette: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.34776 19.4892 5.34776 20.281 4.85857 20.7702L4.70711 20.9216C4.31658 21.3121 3.68342 21.3121 3.29289 20.9216C1.4842 19.1129 0.5 16.6343 0.5 14C0.5 8.20101 5.20101 3.5 11 3.5C16.799 3.5 21.5 8.20101 21.5 14C21.5 19.799 16.799 24.5 11 24.5C9.36567 24.5 7.8202 24.1256 6.44265 23.4568C5.90872 23.1976 5.86178 22.4439 6.34265 22.1221L6.44265 22.0554C6.93184 21.7293 7.02554 21.0544 6.6436 20.6124C6.03332 19.9064 5.5 19.0113 5.5 18C5.5 17.4477 5.94772 17 6.5 17H8.5C9.05228 17 9.5 17.4477 9.5 18V20C9.5 21.1046 10.3954 22 11.5 22H12Z"></path></svg>
      ),
      Sun: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      ),
      Moon: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      ),
      Camera: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      )
    };

    const translations = {
      en: {
        title: "Photo Combiner Studio",
        subtitle: "Generate matching product & price layouts instantly",
        showPrice: "Show Price",
        hidePrice: "Hide Price",
        searchPlaceholder: "Scan barcode or search product by code/name...",
        styleCustomizer: "Card Style & Customizer",
        layoutTheme: "Layout Theme",
        cardBg: "Card Background",
        exportBtn: "Export Combined Image (PNG)",
        rendering: "Rendering Image...",
        liveCanvas: "Live Preview Canvas",
        selectProduct: "No Product Found",
        selectProductDesc: "Scan or enter a product code in the search bar above.",
        codeLabel: "Code:",
        noImage: "No Image Found in Column E"
      },
      kh: {
        title: "ស្ទូឌីយោបន្សំរូបភាព",
        subtitle: "បង្កើតប្លង់ផលិតផល និងតម្លៃដែលត្រូវគ្នាយ៉ាងរហ័ស",
        showPrice: "បង្ហាញតម្លៃ",
        hidePrice: "លាក់តម្លៃ",
        searchPlaceholder: "ស្កែនបារកូដ ឬស្វែងរកផលិតផលតាមកូដ/ឈ្មោះ...",
        styleCustomizer: "រចនាប័ទ្មកាត & ការកំណត់",
        layoutTheme: "ទម្រង់ប្លង់",
        cardBg: "ពណ៌ផ្ទៃខាងក្រោយកាត",
        exportBtn: "ទាញយករូបភាពរួមបញ្ចូលគ្នា (PNG)",
        rendering: "កំពុងបង្កើតរូបភាព...",
        liveCanvas: "ផ្ទាំងទិដ្ឋភាពមើលជាមុន",
        selectProduct: "រកមិនឃើញផលិតផលទេ",
        selectProductDesc: "សូមស្កែន ឬវាយបញ្ចូលលេខកូដផលិតផលក្នុងប្រអប់ស្វែងរកខាងលើ។",
        codeLabel: "លេខកូដ:",
        noImage: "រកមិនឃើញរូបភាពក្នុងជួរឈរ E ទេ"
      }
    };

    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [items, setItems] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncError, setSyncError] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [cameraError, setCameraError] = useState(null);
      const [cameraStatus, setCameraStatus] = useState("");
      const [availableCameras, setAvailableCameras] = useState([]);
      const [activeCameraId, setActiveCameraId] = useState(null);
      
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [lang, setLang] = useState('en');
      
      const [showPrice, setShowPrice] = useState(true);
      const [cardTemplate, setCardTemplate] = useState('modern');
      const [cardBgColor, setCardBgColor] = useState('#ffffff');
      const [cardTextColor, setCardTextColor] = useState('#1f2937');
      
      const [searchQuery, setSearchQuery] = useState("");

      const videoRef = useRef(null);
      const codeReaderRef = useRef(null);
      const cardRef = useRef(null);
      const [exporting, setExporting] = useState(false);

      const t = translations[lang];
      const targetSheetUrl = "https://docs.google.com/spreadsheets/d/1maKk_lPYMYval44vnorm3_awwrIh5IYPKLovn_gWYtg/edit?gid=828283876#gid=828283876";

      useEffect(() => {
        fetchSheetData(targetSheetUrl);
      }, []);

      /* Hardware USB/Bluetooth barcode reader listener */
      useEffect(() => {
        let buffer = "";
        let lastKeyTime = Date.now();

        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' && e.target.type === 'text' && !isScanning) {
            return;
          }

          const currentTime = Date.now();
          if (currentTime - lastKeyTime > 100) {
            buffer = "";
          }
          lastKeyTime = currentTime;

          if (e.key === 'Enter') {
            if (buffer.length > 1) {
              setSearchQuery(buffer.trim());
              buffer = "";
            }
          } else if (e.key.length === 1) {
            buffer += e.key;
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isScanning]);

      /* Releases active media streams */
      const releaseCameraStream = () => {
        const video = videoRef.current;
        if (video && video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
        }
      };

      /* Starts (or restarts) decoding on a specific device id */
      const startDecoding = async (deviceId) => {
        const codeReader = codeReaderRef.current;
        if (!codeReader || !videoRef.current) return;

        await codeReader.decodeFromVideoDevice(deviceId, videoRef.current, (result, err) => {
          if (result) {
            setSearchQuery(result.getText());
            stopCameraScan();
            return;
          }
          if (err && err.name && err.name !== 'NotFoundException' && err.name !== 'ChecksumException' && err.name !== 'FormatException') {
            console.warn("Scan frame error:", err);
          }
        });
      };

      /* Fixed Camera Barcode Scanner Effect */
      useEffect(() => {
        let active = true;

        if (isScanning) {
          setCameraError(null);
          setCameraStatus("Starting camera...");

          const initCamera = async () => {
            try {
              if (typeof ZXing === 'undefined') {
                throw new Error("Scanner library is still loading. Please wait a moment and try again.");
              }

              const hints = new Map();
              if (ZXing.BarcodeFormat && ZXing.DecodeHintType) {
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                  ZXing.BarcodeFormat.EAN_13,
                  ZXing.BarcodeFormat.EAN_8,
                  ZXing.BarcodeFormat.UPC_A,
                  ZXing.BarcodeFormat.UPC_E,
                  ZXing.BarcodeFormat.CODE_128,
                  ZXing.BarcodeFormat.CODE_39,
                  ZXing.BarcodeFormat.ITF,
                  ZXing.BarcodeFormat.QR_CODE
                ]);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
              }

              const codeReader = new ZXing.BrowserMultiFormatReader(hints);
              codeReaderRef.current = codeReader;

              if (!videoRef.current) return;

              // Enumerate devices. On Safari/Firefox, this may return empty if permission 
              // isn't currently active. We no longer throw an error if it's empty!
              let videoDevices = [];
              try {
                videoDevices = await codeReader.listVideoInputDevices();
              } catch (e) {
                console.warn("Device list is currently hidden by the browser.", e);
              }

              if (!active) return;

              let chosenId = undefined;

              if (videoDevices && videoDevices.length > 0) {
                setAvailableCameras(videoDevices);
                // Prefer rear camera lens
                const backCam = videoDevices.find(d => /back|rear|environment/i.test(d.label));
                chosenId = backCam ? backCam.deviceId : videoDevices[0].deviceId;
                setActiveCameraId(chosenId);
              } else {
                // If the browser hides devices for privacy, pass undefined to let ZXing
                // request the default camera and handle permissions natively.
                setAvailableCameras([]);
                setActiveCameraId(null);
              }

              setCameraStatus("");
              
              // Start decoding. If chosenId is undefined, ZXing auto-fetches a camera.
              await startDecoding(chosenId);

              // Wait a couple of seconds for permission to be fully active, then re-check
              // cameras so the "Switch Camera" button becomes available.
              if (!videoDevices || videoDevices.length === 0) {
                setTimeout(async () => {
                  if (active && codeReaderRef.current) {
                    const refreshed = await codeReaderRef.current.listVideoInputDevices();
                    if (refreshed && refreshed.length > 0) {
                      setAvailableCameras(refreshed);
                    }
                  }
                }, 2000);
              }

            } catch (err) {
              console.error("Camera access error:", err);
              if (active) {
                if (err.name === 'NotAllowedError' || err.message?.includes('denied')) {
                  setCameraError("Camera permission was denied. Please allow camera access in your browser settings.");
                } else {
                  setCameraError(err.message || "Could not start the camera.");
                }
                setCameraStatus("");
              }
            }
          };

          initCamera();
        }

        return () => {
          active = false;
          if (codeReaderRef.current) {
            codeReaderRef.current.reset();
            codeReaderRef.current = null;
          }
          releaseCameraStream();
        };
      }, [isScanning]);

      const stopCameraScan = () => {
        if (codeReaderRef.current) {
          codeReaderRef.current.reset();
          codeReaderRef.current = null;
        }
        releaseCameraStream();
        setIsScanning(false);
        setCameraError(null);
        setCameraStatus("");
      };

      /* Cycle to the next available camera */
      const switchCamera = async () => {
        if (availableCameras.length < 2) return;
        const currentIndex = availableCameras.findIndex(d => d.deviceId === activeCameraId);
        const nextDevice = availableCameras[(currentIndex + 1) % availableCameras.length];

        if (codeReaderRef.current) {
          codeReaderRef.current.reset();
        }
        releaseCameraStream();

        setActiveCameraId(nextDevice.deviceId);
        try {
          await startDecoding(nextDevice.deviceId);
        } catch (err) {
          console.error("Camera switch error:", err);
          setCameraError("Could not switch camera.");
        }
      };

      /* Dynamic text color matching contrast */
      useEffect(() => {
        const hex = cardBgColor.replace('#', '');
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        setCardTextColor(luminance > 0.5 ? '#1f2937' : '#ffffff');
      }, [cardBgColor]);

      /* Single active matched product */
      const selectedItem = useMemo(() => {
        if (!items.length) return null;
        if (!searchQuery.trim()) return items[0];

        const query = searchQuery.trim().toLowerCase();

        const exactCode = items.find(i => String(i.code || "").toLowerCase() === query);
        if (exactCode) return exactCode;

        return items.find(i => 
          String(i.code || "").toLowerCase().includes(query) ||
          String(i.name || "").toLowerCase().includes(query)
        ) || null;
      }, [items, searchQuery]);

      /* Fetch Google Sheet Data */
      const fetchSheetData = async (url) => {
        setIsSyncing(true);
        setSyncError(null);

        try {
          let csvUrl = url;
          const sheetIdMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (sheetIdMatch && sheetIdMatch[1]) {
            const spreadsheetId = sheetIdMatch[1];
            let gid = "828283876";
            const gidMatch = url.match(/gid=([0-9]+)/);
            if (gidMatch && gidMatch[1]) {
              gid = gidMatch[1];
            }
            csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
          }

          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error("Could not access spreadsheet. Ensure file is shared as Public Viewer.");
          
          const csvText = await response.text();
          const parsedData = parseCSVToItems(csvText);

          if (parsedData.length === 0) {
            throw new Error("No products found in sheet.");
          }

          setItems(parsedData);
        } catch (err) {
          console.error(err);
          setSyncError(err.message || "Failed to load spreadsheet.");
        } finally {
          setIsSyncing(false);
        }
      };

      const parseCSVToItems = (text) => {
        const lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i+1];

          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              row[row.length - 1] += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            row.push('');
          } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
            lines.push(row);
            row = [''];
          } else {
            row[row.length - 1] += char;
          }
        }
        if (row.length > 1 || row[0] !== '') {
          lines.push(row);
        }

        if (lines.length < 2) return [];

        const headers = lines[0].map(h => h.trim().toLowerCase());
        
        const brandIdx = headers.findIndex(h => h.includes('brand')) !== -1 ? headers.findIndex(h => h.includes('brand')) : 0;
        const classIdx = headers.findIndex(h => h.includes('class')) !== -1 ? headers.findIndex(h => h.includes('class')) : 1;
        const codeIdx = headers.findIndex(h => h.includes('code')) !== -1 ? headers.findIndex(h => h.includes('code')) : 2;
        const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('item')) !== -1 ? headers.findIndex(h => h.includes('name') || h.includes('item')) : 3;
        const imageIdx = 4; // Column E
        const descIdx = headers.findIndex(h => h.includes('desc') || h.includes('detail') || h.includes('description')) !== -1 ? headers.findIndex(h => h.includes('desc') || h.includes('detail') || h.includes('description')) : 5;
        const priceIdx = 9; // Column J

        const itemsParsed = [];
        for (let r = 1; r < lines.length; r++) {
          const line = lines[r];
          if (line.length <= 1 || !line[nameIdx]) continue;

          let rawImgUrl = line[imageIdx] ? line[imageIdx].replace(/^["']|["']$/g, '').trim() : "";

          if (rawImgUrl && rawImgUrl.includes('drive.google.com')) {
            const fileIdMatch = rawImgUrl.match(/id=([a-zA-Z0-9-_]+)/) || rawImgUrl.match(/\/file\/d\/([a-zA-Z0-9-_]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
              rawImgUrl = `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
            }
          }

          let rawPriceStr = (line.length > priceIdx && line[priceIdx]) ? line[priceIdx] : "0";
          const cleanPrice = parseFloat(rawPriceStr.replace(/[^\d.-]/g, '')) || 0;

          const item = {
            brand: line[brandIdx] ? line[brandIdx].trim() : "General",
            itemClass: line[classIdx] ? line[classIdx].trim() : "Products",
            code: line[codeIdx] ? line[codeIdx].trim() : `ITEM-${r}`,
            name: line[nameIdx] ? line[nameIdx].trim() : `Product ${r}`,
            description: line[descIdx] ? line[descIdx].trim() : "No description provided.",
            price: cleanPrice,
            imageUrl: rawImgUrl
          };

          itemsParsed.push(item);
        }

        return itemsParsed;
      };

      const handleExportImage = async () => {
        if (!selectedItem) return;
        setExporting(true);

        try {
          if (typeof html2canvas === 'undefined') {
            throw new Error("Exporting engine loading. Try again in 2 seconds.");
          }

          const canvas = await html2canvas(cardRef.current, {
            useCORS: true, 
            allowTaint: true,
            backgroundColor: cardBgColor,
            scale: 2
          });

          const image = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.download = `${selectedItem.code}_${selectedItem.name.replace(/\s+/g, '_')}_combo.png`;
          link.href = image;
          link.click();
        } catch (err) {
          console.error(err);
          alert("Notice: Export generated. Check browser downloads.");
        } finally {
          setExporting(false);
        }
      };

      const templates = {
        modern: {
          cardClass: "flex flex-col md:flex-row rounded-3xl overflow-hidden border shadow-2xl transition-all duration-300 w-full max-w-4xl min-h-[480px] " + (isDarkMode ? 'border-slate-800' : 'border-slate-100'),
          imgContainer: "w-full md:w-1/2 min-h-[350px] relative flex items-center justify-center overflow-hidden p-6 " + (isDarkMode ? 'bg-slate-950' : 'bg-slate-50'),
          detailsContainer: "w-full md:w-1/2 p-10 flex flex-col justify-between",
          badgeClass: "inline-block bg-orange-50 text-orange-700 text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider mb-4 w-fit",
          titleClass: "text-3xl font-extrabold tracking-tight leading-tight",
          priceClass: "text-4xl font-black text-orange-600 mt-6"
        },
        elegant: {
          cardClass: "flex flex-col rounded-3xl overflow-hidden shadow-2xl border transition-all duration-300 w-full max-w-3xl min-h-[500px] " + (isDarkMode ? 'border-orange-950' : 'border-orange-200/50'),
          imgContainer: "w-full h-96 relative flex items-center justify-center overflow-hidden border-b p-6 " + (isDarkMode ? 'bg-slate-950 border-orange-950' : 'bg-orange-50/20 border-orange-100'),
          detailsContainer: "w-full p-10 flex flex-col justify-center items-center text-center",
          badgeClass: "inline-block bg-orange-100 text-orange-900 text-xs font-semibold px-5 py-2 rounded-full uppercase tracking-widest mb-4",
          titleClass: "text-4xl font-serif-elegant font-bold tracking-normal italic",
          priceClass: "text-3xl font-serif-elegant text-orange-600 border-t border-b py-3 px-8 my-6 " + (isDarkMode ? 'border-slate-800' : 'border-orange-200')
        },
        classic: {
          cardClass: "flex flex-col md:flex-row rounded-2xl border-2 p-8 shadow-xl transition-all duration-300 w-full max-w-4xl min-h-[480px] " + (isDarkMode ? 'border-slate-700' : 'border-slate-900'),
          imgContainer: "w-full md:w-5/12 aspect-square relative flex items-center justify-center overflow-hidden border-2 p-4 " + (isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-white border-slate-200'),
          detailsContainer: "w-full md:w-7/12 pl-0 md:pl-10 pt-6 md:pt-0 flex flex-col justify-between",
          badgeClass: "inline-block border-2 text-xs font-mono px-3 py-1 uppercase mb-4 w-fit " + (isDarkMode ? 'text-slate-300 border-slate-600' : 'text-slate-950 border-slate-950'),
          titleClass: "text-3xl font-mono-code font-bold uppercase tracking-tight",
          priceClass: "text-2xl font-mono-code font-bold text-slate-900 bg-orange-50 p-3 text-center border-2 border-orange-200 mt-6"
        },
        minimalist: {
          cardClass: "flex flex-col rounded-3xl p-6 shadow-lg border transition-all duration-300 w-full max-w-3xl min-h-[480px] " + (isDarkMode ? 'border-slate-800' : 'border-slate-100'),
          imgContainer: "w-full aspect-[16/10] rounded-2xl relative flex items-center justify-center overflow-hidden p-6 " + (isDarkMode ? 'bg-slate-950' : 'bg-slate-50'),
          detailsContainer: "w-full pt-8 px-2 flex flex-col justify-start",
          badgeClass: "text-xs font-medium text-slate-400 mb-2 block uppercase tracking-widest",
          titleClass: "text-3xl font-light tracking-tight",
          priceClass: "text-2xl font-medium text-orange-600 mt-4"
        }
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 flex flex-col ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
          
          <header className={`border-b sticky top-0 z-40 transition-colors duration-300 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-orange-600 text-white p-2 rounded-xl">
                  <SvgIcons.Image />
                </div>
                <div>
                  <h1 className={`text-xl font-extrabold tracking-tight ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{t.title}</h1>
                  <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-500'} font-medium`}>{t.subtitle}</p>
                </div>
              </div>
              
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setLang(lang === 'en' ? 'kh' : 'en')}
                  className={`px-3 py-2 text-xs font-bold rounded-xl border transition-all flex items-center space-x-1.5 ${
                    isDarkMode 
                      ? 'bg-slate-800 border-slate-700 text-white hover:bg-slate-700' 
                      : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  <span>{lang === 'en' ? '🇰🇭 Khmer' : '🇬🇧 English'}</span>
                </button>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className={`p-2.5 rounded-xl border transition-all ${
                    isDarkMode 
                      ? 'bg-slate-800 border-slate-700 text-amber-400 hover:bg-slate-700' 
                      : 'bg-slate-100 border-slate-200 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {isDarkMode ? <SvgIcons.Sun /> : <SvgIcons.Moon />}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 flex flex-col space-y-6 w-full">
            
            {syncError && (
              <div className="p-4 bg-rose-50 text-rose-700 rounded-xl text-xs flex items-center gap-2 border border-rose-100">
                <SvgIcons.Alert />
                <span>{syncError}</span>
              </div>
            )}

            {/* SEARCH BAR */}
            <div className={`rounded-2xl border p-4 shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
              <div className="relative flex items-center">
                <div className="absolute left-4 text-slate-400">
                  <SvgIcons.Search />
                </div>
                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  className={`w-full pl-12 pr-32 py-4 border rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all ${
                    isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                  }`}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
                
                <div className="absolute right-2 flex items-center gap-2">
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery("")}
                      className="px-2 py-1 text-xs text-slate-400 hover:text-slate-600"
                    >
                      Clear
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => setIsScanning(true)}
                    className="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs shadow-md transition-all"
                  >
                    <SvgIcons.Barcode />
                    <span className="hidden sm:inline">Scan Code</span>
                  </button>
                </div>
              </div>
            </div>

            {/* CAMERA BARCODE SCANNER MODAL */}
            {isScanning && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4">
                <div className="relative bg-slate-900 p-6 rounded-3xl max-w-md w-full flex flex-col items-center space-y-4 border border-slate-800 shadow-2xl">
                  <div className="flex items-center justify-between w-full">
                    <h3 className="text-white text-base font-bold flex items-center gap-2">
                      <SvgIcons.Barcode />
                      <span>Scanning Barcode / QR Code</span>
                    </h3>
                    {availableCameras.length > 1 && !cameraError && (
                      <button
                        onClick={switchCamera}
                        title="Switch camera"
                        className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all"
                      >
                        <SvgIcons.Camera />
                      </button>
                    )}
                  </div>
                  
                  <div className="w-full h-64 rounded-2xl overflow-hidden border-2 border-orange-500/50 relative bg-black flex items-center justify-center">
                    <video 
                      ref={videoRef} 
                      autoPlay 
                      playsInline 
                      muted 
                      className="w-full h-full object-cover"
                    ></video>
                    {!cameraError && (
                      <div className="absolute inset-0 border-2 border-orange-500 animate-pulse pointer-events-none rounded-2xl"></div>
                    )}
                    {cameraStatus && !cameraError && (
                      <div className="absolute inset-0 flex items-center justify-center bg-black/60 text-slate-200 text-xs font-medium px-6 text-center">
                        {cameraStatus}
                      </div>
                    )}
                    {cameraError && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black/80 text-rose-300 text-xs font-medium px-6 text-center">
                        <SvgIcons.Alert />
                        <span>{cameraError}</span>
                      </div>
                    )}
                  </div>
                  
                  <p className="text-xs text-slate-400 text-center">
                    {cameraError ? "Check camera permissions in your browser settings, then try again." : "Position product barcode clearly inside the camera box"}
                  </p>
                  
                  <button
                    onClick={stopCameraScan}
                    className="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-all"
                  >
                    Cancel Scan
                  </button>
                </div>
              </div>
            )}

            {/* MAIN CANVAS LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
              
              <div className="lg:col-span-8 flex flex-col space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-sm font-bold text-slate-400 uppercase tracking-wider">{t.liveCanvas}</span>
                  
                  <div className={`p-1 rounded-xl flex items-center space-x-1 border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <button 
                      onClick={() => setShowPrice(true)}
                      className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${showPrice ? 'bg-orange-600 text-white shadow-xs' : 'text-slate-500'}`}
                    >
                      <SvgIcons.Eye />
                      <span>{t.showPrice}</span>
                    </button>
                    <button 
                      onClick={() => setShowPrice(false)}
                      className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${!showPrice ? 'bg-orange-600 text-white shadow-xs' : 'text-slate-500'}`}
                    >
                      <SvgIcons.EyeOff />
                      <span>{t.hidePrice}</span>
                    </button>
                  </div>
                </div>

                <div className={`flex-1 rounded-3xl border p-6 flex items-center justify-center ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white border-slate-200'}`}>
                  {selectedItem ? (
                    <div 
                      ref={cardRef} 
                      style={{ backgroundColor: cardBgColor, color: cardTextColor }}
                      className={`${templates[cardTemplate].cardClass} select-none transition-all duration-300 shadow-2xl`}
                    >
                      <div className={templates[cardTemplate].imgContainer}>
                        {selectedItem.imageUrl ? (
                          <img 
                            src={selectedItem.imageUrl} 
                            alt={selectedItem.name} 
                            className="w-full h-full object-contain block max-h-[400px]"
                            crossOrigin="anonymous"
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = "https://images.unsplash.com/photo-1594322436404-5a0526db4d13?auto=format&fit=crop&w=600&q=80";
                            }}
                          />
                        ) : (
                          <div className="flex flex-col items-center justify-center text-slate-400 p-8">
                            <div className="mb-2"><SvgIcons.Image /></div>
                            <span className="text-xs font-medium">{t.noImage}</span>
                          </div>
                        )}
                        
                        <div className="absolute top-4 left-4 bg-black/70 backdrop-blur-md text-xs text-white px-3 py-1 rounded-lg font-mono-code uppercase">
                          {selectedItem.brand} / {selectedItem.itemClass}
                        </div>
                      </div>

                      <div className={templates[cardTemplate].detailsContainer}>
                        <div>
                          <span className={templates[cardTemplate].badgeClass}>
                            {t.codeLabel} {selectedItem.code}
                          </span>
                          <h2 className={templates[cardTemplate].titleClass}>
                            {selectedItem.name}
                          </h2>
                          <p className="text-sm mt-4 leading-relaxed opacity-80">
                            {selectedItem.description}
                          </p>
                        </div>

                        {showPrice ? (
                          <div className={templates[cardTemplate].priceClass}>
                            ${selectedItem.price ? selectedItem.price.toLocaleString(undefined, {minimumFractionDigits: 2}) : "0.00"}
                          </div>
                        ) : null}
                      </div>
                    </div>
                  ) : (
                    <div className={`rounded-3xl border-2 border-dashed p-16 text-center text-slate-400 w-full max-w-lg ${
                      isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-50 border-slate-300'
                    }`}>
                      <div className="mx-auto mb-4 text-slate-300 flex justify-center"><SvgIcons.Image /></div>
                      <p className="font-bold text-base text-slate-600 dark:text-slate-300">{t.selectProduct}</p>
                      <p className="text-xs text-slate-400 mt-1">{t.selectProductDesc}</p>
                    </div>
                  )}
                </div>
              </div>

              {/* STYLE CUSTOMIZER */}
              <div className="lg:col-span-4 flex flex-col justify-start">
                <div className={`rounded-3xl border p-6 space-y-6 sticky top-24 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="text-base font-bold flex items-center gap-2 border-b pb-4 dark:border-slate-800">
                    <SvgIcons.Palette />
                    <span>{t.styleCustomizer}</span>
                  </h3>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-2 uppercase">{t.layoutTheme}</label>
                      <div className="relative">
                        <select
                          value={cardTemplate}
                          onChange={(e) => setCardTemplate(e.target.value)}
                          className={`w-full border rounded-xl text-sm py-3 px-4 appearance-none focus:outline-none focus:ring-2 focus:ring-orange-500/20 font-medium ${
                            isDarkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                          }`}
                        >
                          <option value="modern">⚡ Modern (2-Column)</option>
                          <option value="elegant">✨ Elegant (Centered)</option>
                          <option value="classic">🛡️ Classic (Mono Bold)</option>
                          <option value="minimalist">🍃 Minimalist (Soft)</option>
                        </select>
                        <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                          <SvgIcons.ChevronDown />
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-2 uppercase">{t.cardBg}</label>
                      <div className={`flex items-center space-x-3 border rounded-xl p-3 ${
                        isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                      }`}>
                        <input
                          type="color"
                          value={cardBgColor}
                          onChange={(e) => setCardBgColor(e.target.value)}
                          className="w-8 h-8 rounded-lg border-0 cursor-pointer bg-transparent"
                        />
                        <span className="text-xs font-mono-code uppercase text-slate-500 font-bold">{cardBgColor}</span>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={handleExportImage}
                    disabled={exporting || !selectedItem}
                    className="w-full py-4 px-6 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 disabled:opacity-50 text-white font-bold text-sm rounded-xl transition-all shadow-lg flex items-center justify-center space-x-2"
                  >
                    <SvgIcons.Download />
                    <span>{exporting ? t.rendering : t.exportBtn}</span>
                  </button>
                </div>
              </div>

            </div>

          </main>

          <footer className={`border-t py-6 text-center text-xs transition-colors duration-300 ${
            isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500'
          }`}>
            <p>&copy; 2026 Photo Combiner Studio • Maximum Canvas Workspace</p>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('app-root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
